name: 'Stars Appearing'

description: 'Brightest stars appear first, pitch mapped to colour. Glockenspiel base sound.'

generator:
  type: 'sampler'
  sample: 'Glockenspiel'

sources: 'events'

map:
  
  - input_range: ['0%', '110%']
    output: 'time'

  - output: 'pitch'
    function: '-x'

  - output: 'volume'
    output_range: [0.2, 1]
    function: 'log(x)'

  - output: 'pan'

notes: ['G2', 'D3', 'G3', 'B4', 'F#4']
  
  

