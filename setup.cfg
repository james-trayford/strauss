[metadata]
name = strauss
version = 1.0.3
author = James Trayford
author_email = james.trayford@port.ac.uk
description = Sonification Tools and Resources for Astronomers Using Sound Synthesis
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/james-trayford/strauss
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: Apache Software License
    Operating System :: OS Independent

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.6
include_package_data = True
install_requires =
 jupyterlab
 ipython
 matplotlib
 numpy
 pandas
 pychord
 pyyaml
 scipy
 setuptools >= 4.2
 wavio
 wheel
 sounddevice
 sf2utils
 ipytone
 ffmpeg-python
 pooch
 pydantic >= 2
 audioop-lts; python_version >= "3.13"
[options.packages.find]
where = src
[options.extras_require]
default =
 tqdm
docs =
 sphinx
 sphinx-exec-code
 sphinxcontrib.jquery
 myst-parser
 sphinx-rtd-theme
# 'speech' is new name for TTS; 'TTS' and 'AI-TTS' remain for back compatibility.
# kokoro (and misaki) limited to Python<=3.12 on PyPI, so kokoro-onnx (same model
# and voices) dropped in for 3.13. Requires Python<3.14, so nothing is installed
# in this case. Use 'pip install --ignore-requires-python kokoro-onnx==0.6.1' there 
# (without >=0.6.1 will fail to install working TTS).
speech =
 kokoro >= 0.9.4; python_version < "3.13"
 kokoro-onnx >= 0.6.1; python_version == "3.13"
TTS =
 kokoro >= 0.9.4; python_version < "3.13"
 kokoro-onnx >= 0.6.1; python_version == "3.13"
AI-TTS =
 kokoro >= 0.9.4; python_version < "3.13"
 kokoro-onnx >= 0.6.1; python_version == "3.13"
kokoro =
 kokoro >= 0.9.4; python_version < "3.13"
kokoro-onnx =
 kokoro-onnx >= 0.6.1; python_version < "3.14"
