name: 'Mallets'

description: 'Mapping pitch on a musical scale with staccato notes'

generator:
  type: 'sampler'
  sample: 'mallet'

sources: 'events'

max_notes_per_sec: 15

map:

  - input_range: ['0%', '110%']
    output: 'time'

  - output: 'pitch'

  - output: 'pan'
    fixed: true
    input_range: [0, 1]

notes: 'C11'
  
  

