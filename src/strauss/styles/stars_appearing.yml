name: 'Stars Appearing'

description: 'Brightest stars appear first, pitch mapped to colour. Glockenspiel base sound.'

generator:
  type: 'sampler'
  sample: 'glockenspiel'

sources: 'events'

map:

  - input: 'magnitude'
    input_range: ['0%', '110%']
    output: 'time'

  - input: 'colour'
    output: 'pitch'

  - input: 'magnitude'
    output: 'volume'
    output_range: [0.2, 1]

  - input: 'ra'
    output: 'pan'


notes: ['G2', 'D3', 'G3', 'B4', 'F#4']
  
  

